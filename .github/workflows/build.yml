name: Build CenterLock IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q CenterLockAI-v1.1-Bluetooth.zip

      - name: Build iOS application
        run: |
          cd CenterLockAI-v1.1

          xcodebuild \
            -project CenterLockAI.xcodeproj \
            -scheme CenterLockAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R CenterLockAI-v1.1/build/Build/Products/Release-iphoneos/CenterLockAI.app Payload/
          zip -qry CenterLockAI.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CenterLockAI-IPA
          path: CenterLockAI.ipa
